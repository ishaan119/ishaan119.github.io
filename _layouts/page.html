---
layout: default
---

<article class="post">
  <header class="post-header shell">
    <h1 class="post-title">{{ page.title }}</h1>
    {%- if page.subtitle -%}<p class="post-subtitle">{{ page.subtitle }}</p>{%- endif -%}
  </header>
  <div class="post-body shell no-toc">
    <div class="post-content">
      {{ content }}
    </div>
  </div>
</article>
